<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Макет</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #202020;
        }

        .row, .column {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .column {
            flex-direction: column;
        }

        .layout {
            height: 700px;
            padding: 15px;
            background: black;
        }

        .block {
            flex: 1;
            background: white;
            border-radius: 10px;
        }

        .double {
            flex: 2;
        }

        .triple {
            flex: 3;
        }
    </style>
</head>
<body>
    <div class="row layout">
        <div class="column triple">
            <div class="row double">
                <div class="column">
                    <div class="block double"></div>
                    <div class="block"></div>
                </div>

                <div class="column double">
                    <div class="row">
                        <div class="block"></div>
                        <div class="block"></div>
                    </div>
                    <div class="block" style="flex: 1.5"></div>
                </div>
            </div>

            <div class="row">
                <div class="block double"></div>
                <div class="block"></div>
            </div>
        </div>

        <div class="column">
            <div class="block"></div>
            <div class="block"></div>
        </div>
    </div>
</body>
</html>
